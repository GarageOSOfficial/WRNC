    <style>
      :root {
        color-scheme: dark;
        background: #080808;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080808;
      }

      body {
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .page {
        min-height: 100dvh;
        padding: 0 24px;
      }

      .hero {
        width: min(100%, 920px);
        min-height: 78dvh;
        margin: 0 auto;
        padding: 72px 0 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .logo {
        display: block;
        width: min(226px, 62vw);
        height: auto;
        margin: 0 0 64px;
      }

      h1 {
        margin: 0;
        max-width: 760px;
        color: #fff;
        font-size: clamp(2.15rem, 6vw, 3rem);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: 0.01em;
        text-wrap: balance;
      }

      .copy {
        max-width: 660px;
        margin: 22px auto 0;
        color: #c0c0c0;
        font-size: clamp(1rem, 2.4vw, 1.125rem);
        line-height: 1.56;
      }

      .status {
        margin-top: 52px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .built {
        margin: 0;
        color: #fff;
        font-size: 0.94rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .accent {
        width: 42px;
        height: 2px;
        margin: 18px 0;
        background: #ff6400;
      }

      .coming {
        margin: 0;
        color: #c0c0c0;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.28em;
      }

      .launch-list {
        width: min(100%, 700px);
        margin-top: 52px;
      }

      #product-preview[hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        .page {
          padding: 0 20px;
        }

        .hero {
          min-height: 82dvh;
          padding: 54px 0 46px;
        }

        .logo {
          margin-bottom: 48px;
        }

        h1 {
          font-size: clamp(2rem, 10vw, 2.55rem);
        }

        .copy {
          margin-top: 18px;
          line-height: 1.5;
        }

        .status {
          margin-top: 42px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>

    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="coming-soon-heading">
        <img class="logo" src="../wrnc-logo.png" alt="WRNC" width="226" height="50" decoding="async" fetchpriority="high" />

        <h1 id="coming-soon-heading">EVERY BUILD DESERVES<br />A LIVING RECORD.</h1>

        <p class="copy">Your build history shouldn’t be scattered across camera rolls, receipts, emails, notes and memory.</p>
        <p class="copy">WRNC is building a purpose-built home for the Builder and the Build.</p>

        <div class="status">
          <p class="built">BUILT FOR BUILDERS.</p>
          <span class="accent" aria-hidden="true"></span>
          <p class="coming">COMING SOON</p>
        </div>

        <div class="launch-list" aria-label="Join the WRNC Launch List">
          <script async data-uid="9cf45d2196" src="https://wrnc.kit.com/9cf45d2196/index.js"></script>
        </div>
      </section>

      <section id="product-preview" hidden aria-label="WRNC product preview"></section>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var referrer = document.referrer || 'direct';
        var source = params.get('utm_source') || sourceFromReferrer(referrer);
        var data = { source: source, referrer: referrer };
        var keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];

        keys.forEach(function (key) {
          var value = params.get(key);
          if (!value) return;
          data[key] = value;
          try {
            sessionStorage.setItem('wrnc_' + key, value);
          } catch (error) {}
        });

        window.va('event', { name: 'Coming Soon Visit', data: data });

        function sourceFromReferrer(value) {
          if (!value || value === 'direct') return 'direct';
          try {
            var host = new URL(value).hostname.toLowerCase();
            if (host.indexOf('instagram.com') >= 0) return 'instagram';
            if (host.indexOf('tiktok.com') >= 0) return 'tiktok';
            if (host.indexOf('facebook.com') >= 0 || host.indexOf('fb.com') >= 0) return 'facebook';
            if (host.indexOf('youtube.com') >= 0 || host.indexOf('youtu.be') >= 0) return 'youtube';
            if (host.indexOf('reddit.com') >= 0) return 'reddit';
            if (host.indexOf('linktr.ee') >= 0 || host.indexOf('linktree') >= 0) return 'linktree';
            return host;
          } catch (error) {
            return 'unknown';
          }
        }
      })();
    </script>
  </body>
